name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write
  statuses: read
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # An empty or expired RELEASE_PLEASE_TOKEN silently falls through the
      # `||` fallback to GITHUB_TOKEN, whose PR pushes can't trigger Foreman's
      # Gate check (GitHub's recursion guard) — auto-merge then blocks
      # indefinitely (#451). Surface that misconfiguration loudly instead of
      # failing the release: warn and continue (fail-open).
      - name: Check release token identity
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          LOGIN=$(gh api user --jq .login 2>/dev/null || echo "")
          if [ -z "$LOGIN" ] || [ "$LOGIN" = "github-actions[bot]" ]; then
            echo "::warning title=RELEASE_PLEASE_TOKEN not in effect::The release token resolves to '${LOGIN:-<no identity>}'. An empty, expired, or under-scoped RELEASE_PLEASE_TOKEN secret silently falls back to GITHUB_TOKEN, so release PR pushes cannot trigger the Gate check and auto-merge stalls (#451). Re-mint a classic PAT with repo scope and run: gh secret set RELEASE_PLEASE_TOKEN"
          else
            echo "Release token identity: $LOGIN"
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A non-default token is REQUIRED for the pipeline to self-drive. The
          # default GITHUB_TOKEN cannot trigger downstream workflows (GitHub's
          # recursion guard), so release-please's PR pushes never fired Foreman's
          # `Gate` check (auto-merge blocked indefinitely) and its post-merge push
          # to main never triggered this Release run again (verify-key/publish
          # skipped). A PAT or GitHub App token attributes those events to a real
          # write identity, so Gate runs without manual approval and publish fires.
          # Falls back to GITHUB_TOKEN when the secret is absent so the workflow
          # never hard-fails — it just reverts to the manual-nudge behaviour.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge release PR
        run: |
          PR_NUM=$(gh pr list \
            --head "release-please--branches--main--components--caliper" \
            --state open \
            --json number \
            --jq '.[0].number // ""')
          # Never touch the autorelease label here: release-please only tags and
          # publishes merged PRs still labelled "autorelease: pending" and flips
          # the label itself once the release exists. Pre-labelling "tagged"
          # made it skip 0.2.27-0.2.30 entirely (merged, never tagged).
          if [ -n "$PR_NUM" ]; then
            gh pr merge "$PR_NUM" --auto --rebase || true
          fi
        env:
          # Same token as above: the merge must be attributed to a non-bot identity
          # so the resulting push to main triggers the publish path of this workflow.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  verify-key:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release key
        run: |
          SHA=$(git rev-parse HEAD)
          STORED=$(gh api repos/${{ github.repository }}/commits/"$SHA"/status \
            --jq '[.statuses[] | select(.context == "ci/release-key")] | first | .description')
          if [ -z "$STORED" ] || [ "$STORED" = "null" ]; then
            echo "ERROR: No ci/release-key status found for $SHA — blocking publication" >&2
            exit 1
          fi
          EXPECTED=$(python3 -c "import hmac,hashlib,os; print(hmac.new(os.environ['RELEASE_UNLOCK_WORD'].encode(), os.environ['VERIFY_SHA'].encode(), hashlib.sha256).hexdigest())")
          if [ "$STORED" = "$EXPECTED" ]; then
            echo "VERIFIED"
          else
            echo "MISMATCH" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_UNLOCK_WORD: ${{ secrets.RELEASE_UNLOCK_WORD }}
          VERIFY_SHA: ${{ github.sha }}

  publish:
    needs: [release-please, verify-key]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/caliper-review/
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Build
        run: uv build

      - name: Generate SBOM
        run: |
          uv tool install cyclonedx-bom --force
          cyclonedx-py environment -o sbom.cdx.json --of json

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/*

      - name: Upload stable release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-${{ needs.release-please.outputs.tag_name }}
          path: |
            dist/*
            sbom.cdx.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          print-hash: true

  # Every release SHA gets its version as an image tag: the image build-container
  # pushed for this exact commit (IMAGE:<sha>) is re-tagged IMAGE:<version> and
  # IMAGE:v<version> by manifest copy, so the tag, the SHA and the digest agree.
  tag-image:
    needs: [release-please, verify-key]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Tag release image with version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          SHA: ${{ github.sha }}
        run: bash scripts/tag-release-image.sh "$SHA" "$VERSION" "ghcr.io/${{ github.repository }}"
