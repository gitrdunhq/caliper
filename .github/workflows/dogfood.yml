name: Dogfood

on:
  schedule:
    - cron: '0 15 * * 1'  # Monday 9am Edmonton (UTC-6)
  workflow_dispatch:

env:
  SCANNER_BIN: /tmp/scanner-bin
  TRIVY_CACHE_DIR: /tmp/trivy-cache

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Install deps
        run: |
          uv sync --group dev
          uv pip install lizard mypy pyrefly radon

      - name: Install scanners
        uses: ./.github/actions/install-scanners

      - name: Run caliper self-review
        run: uv run caliper review --repo-path . --format sarif --output dogfood-results.sarif

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-sarif
          path: dogfood-results.sarif
          retention-days: 30
