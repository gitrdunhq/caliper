name: Install scanner binaries
description: >-
  Restores (or installs) the pinned scanner binaries used by the review /
  e2e / release jobs, adds them to PATH, and warms the trivy vulnerability DB
  cache. Every binary except pmd comes from `caliper install-scanners`, so CI
  runs the same sha256-verified releases the container bakes in
  (core/scanner_pins.py). pmd needs a JRE and is not pinned there; its version
  is read from the Dockerfile's PMD_VERSION so the two never drift. The cache
  key hashes both files, so a pin bump naturally invalidates the cache.
  Requires `uv sync` to have run first (the caliper CLI must be importable).

runs:
  using: composite
  steps:
    - name: Cache scanner binaries
      id: scanner-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
      with:
        path: ${{ env.SCANNER_BIN }}
        key: scanners-${{ hashFiles('src/caliper/core/scanner_pins.py', 'Dockerfile') }}

    - name: Cache trivy DB
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
      with:
        path: ${{ env.TRIVY_CACHE_DIR }}
        key: trivy-db-${{ github.run_id }}
        restore-keys: trivy-db-

    - name: Install scanner binaries
      if: steps.scanner-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$SCANNER_BIN"
        uv run caliper install-scanners --yes --bin-dir "$SCANNER_BIN"
        PMD_VERSION=$(sed -n 's/^ARG PMD_VERSION=//p' Dockerfile)
        curl -sSfL -o /tmp/pmd.zip "https://github.com/pmd/pmd/releases/download/pmd_releases/${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip" && unzip -qo /tmp/pmd.zip -d /tmp && cp -r "/tmp/pmd-bin-${PMD_VERSION}" "$SCANNER_BIN/pmd-bin" || echo "::warning::pmd ${PMD_VERSION} install failed; the pmd/cpd plugins will report NOT_INSTALLED"

    - name: Add scanners to PATH and warm trivy DB
      shell: bash
      run: |
        echo "$SCANNER_BIN" >> "$GITHUB_PATH"
        if [ -f "$SCANNER_BIN/pmd-bin/bin/pmd" ]; then
          echo "$SCANNER_BIN/pmd-bin/bin" >> "$GITHUB_PATH"
        fi
        "$SCANNER_BIN/trivy" fs --download-db-only --cache-dir "$TRIVY_CACHE_DIR" || true
